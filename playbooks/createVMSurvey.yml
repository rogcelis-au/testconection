---
- name: Create Nutanix VM
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Create VM
      nutanix.ncp.ntnx_vms:
        state: present

        nutanix_host: "{{ nutanix_host }}"
        nutanix_username: "{{ nutanix_username }}"
        nutanix_password: "{{ nutanix_password }}"
        validate_certs: "{{ validate_certs }}"

        name: "{{ vm_name }}"
        desc: "{{ vm_description }}"

        cluster:
          name: "{{ cluster_name }}"

        vcpus: 1
        cores_per_vcpu: "{{ cpu }}"

        memory_gb: "{{ (memory_mb | int / 1024) | int }}"

        networks:
          - subnet:
              name: "{{ subnet_name }}"
